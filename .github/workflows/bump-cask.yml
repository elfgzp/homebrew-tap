name: Bump Cask Version

on:
  # 监听 anime1-desktop 仓库的 release 事件
  repository_dispatch:
    types: [bump-cask]
  # 手动触发
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 0.3.4)'
        required: true
      sha256_arm64:
        description: 'arm64 DMG 的 SHA256 (可选，自动计算)'
        required: false
      sha256_x64:
        description: 'x64 DMG 的 SHA256 (可选，自动计算)'
        required: false

jobs:
  bump-cask:
    runs-on: macos-latest
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4
        
      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@master
        
      - name: Get version from dispatch
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "VERSION=${{ github.event.client_payload.version }}" >> $GITHUB_ENV
          
      - name: Get version from manual input
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          
      - name: Calculate SHA256 for arm64
        run: |
          URL="https://github.com/elfgzp/anime1-desktop/releases/download/v${VERSION}/Anime1Desktop-${VERSION}-arm64.dmg"
          echo "Downloading arm64 DMG from $URL..."
          curl -L -o /tmp/anime1-arm64.dmg "$URL"
          SHA256_ARM64=$(shasum -a 256 /tmp/anime1-arm64.dmg | awk '{print $1}')
          echo "SHA256_ARM64=$SHA256_ARM64" >> $GITHUB_ENV
          echo "arm64 SHA256: $SHA256_ARM64"
          
      - name: Calculate SHA256 for x64
        run: |
          URL="https://github.com/elfgzp/anime1-desktop/releases/download/v${VERSION}/Anime1Desktop-${VERSION}-x64.dmg"
          echo "Downloading x64 DMG from $URL..."
          if curl -L -o /tmp/anime1-x64.dmg "$URL" 2>/dev/null; then
            SHA256_X64=$(shasum -a 256 /tmp/anime1-x64.dmg | awk '{print $1}')
            echo "SHA256_X64=$SHA256_X64" >> $GITHUB_ENV
            echo "x64 SHA256: $SHA256_X64"
          else
            echo "x64 DMG not found, will use arm64 only"
            echo "SHA256_X64=" >> $GITHUB_ENV
          fi
          
      - name: Update Cask file
        run: |
          cat > Casks/anime1-desktop.rb << CASK
      cask "anime1-desktop" do
        arch arm: "arm64", intel: "x64"
        
        version "${VERSION}"
        sha256 arm: "${SHA256_ARM64}", intel: "${SHA256_X64}"
        
        url "https://github.com/elfgzp/anime1-desktop/releases/download/v\#{version}/Anime1Desktop-\#{version}-\#{arch}.dmg"
        
        name "Anime1 Desktop"
        desc "Anime1 Desktop - Anime Browser"
        homepage "https://github.com/elfgzp/anime1-desktop"
        
        livecheck do
          url :url
          strategy :github_latest
        end
        
        app "Anime1Desktop.app"
        
        zap trash: [
          "~/Library/Application Support/Anime1 Desktop",
          "~/Library/Preferences/com.elfgzp.anime1-desktop.plist",
          "~/Library/Saved Application State/com.elfgzp.anime1-desktop.savedState",
        ]
      end
      CASK
          
      - name: Verify Cask
        run: |
          brew install --cask ./Casks/anime1-desktop.rb --dry-run
          
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "bump: anime1-desktop to ${{ env.VERSION }}"
          title: "bump: anime1-desktop to ${{ env.VERSION }}"
          body: |
            自动更新 anime1-desktop 到 v${{ env.VERSION }}
            
            - arm64 SHA256: `${{ env.SHA256_ARM64 }}`
            - x64 SHA256: `${{ env.SHA256_X64 }}`
            
            Release: https://github.com/elfgzp/anime1-desktop/releases/tag/v${{ env.VERSION }}
          branch: bump-anime1-desktop-${{ env.VERSION }}
          delete-branch: true
