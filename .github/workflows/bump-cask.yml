name: Bump Cask Version

on:
  repository_dispatch:
    types: [bump-cask]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 0.3.6)'
        required: true

jobs:
  bump-cask:
    runs-on: macos-latest
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4
        
      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@master
        
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            VERSION="${{ github.event.client_payload.version }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION"
          
      - name: Calculate SHA256 for arm64
        id: sha_arm64
        run: |
          URL="https://github.com/elfgzp/anime1-desktop/releases/download/v${VERSION}/Anime1Desktop-${VERSION}-arm64.dmg"
          echo "Downloading from $URL..."
          curl -L --fail -o /tmp/anime1-arm64.dmg "$URL" || exit 1
          SHA256=$(shasum -a 256 /tmp/anime1-arm64.dmg | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "arm64 SHA256: $SHA256"
          
      - name: Calculate SHA256 for x64
        id: sha_x64
        run: |
          URL="https://github.com/elfgzp/anime1-desktop/releases/download/v${VERSION}/Anime1Desktop-${VERSION}-x64.dmg"
          echo "Downloading from $URL..."
          if curl -L --fail -o /tmp/anime1-x64.dmg "$URL" 2>/dev/null; then
            SHA256=$(shasum -a 256 /tmp/anime1-x64.dmg | awk '{print $1}')
            echo "sha256=$SHA256" >> $GITHUB_OUTPUT
            echo "x64 SHA256: $SHA256"
          else
            echo "x64 build not found, skipping"
            echo "sha256=" >> $GITHUB_OUTPUT
          fi
          
      - name: Update Cask file
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          SHA_ARM64="${{ steps.sha_arm64.outputs.sha256 }}"
          SHA_X64="${{ steps.sha_x64.outputs.sha256 }}"
          
          cat > Casks/anime1-desktop.rb << EOF
cask "anime1-desktop" do
  arch arm: "arm64", intel: "x64"
  
  version "${VERSION}"
EOF
          
          if [ -n "$SHA_X64" ]; then
            echo "  sha256 arm: \"${SHA_ARM64}\", intel: \"${SHA_X64}\"" >> Casks/anime1-desktop.rb
          else
            echo "  sha256 arm: \"${SHA_ARM64}\"" >> Casks/anime1-desktop.rb
          fi
          
          cat >> Casks/anime1-desktop.rb << 'EOF'
  
  url "https://github.com/elfgzp/anime1-desktop/releases/download/v\#{version}/Anime1Desktop-\#{version}-\#{arch}.dmg"
  
  name "Anime1 Desktop"
  desc "Anime1 Desktop - Anime Browser"
  homepage "https://github.com/elfgzp/anime1-desktop"
  
  livecheck do
    url :url
    strategy :github_latest
  end
  
  app "Anime1Desktop.app"
  
  zap trash: [
    "~/Library/Application Support/Anime1 Desktop",
    "~/Library/Preferences/com.elfgzp.anime1-desktop.plist",
    "~/Library/Saved Application State/com.elfgzp.anime1-desktop.savedState",
  ]
end
EOF
          
          echo "Updated Cask:"
          cat Casks/anime1-desktop.rb
          
      - name: Verify Cask
        run: |
          brew style Casks/anime1-desktop.rb || true
          
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "bump: anime1-desktop to ${{ steps.get_version.outputs.version }}"
          title: "bump: anime1-desktop to ${{ steps.get_version.outputs.version }}"
          body: |
            自动更新 anime1-desktop 到 v${{ steps.get_version.outputs.version }}
            
            - arm64 SHA256: `${{ steps.sha_arm64.outputs.sha256 }}`
            - x64 SHA256: `${{ steps.sha_x64.outputs.sha256 }}`
            
            Release: https://github.com/elfgzp/anime1-desktop/releases/tag/v${{ steps.get_version.outputs.version }}
          branch: bump-anime1-desktop-${{ steps.get_version.outputs.version }}
          delete-branch: true
